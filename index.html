<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrubbSims — Interactive STEM Web Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --badge-bg: #0284c720;
      --badge-text: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 3rem 1.5rem 2rem;
      text-align: center;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Updated branding container to better showcase the prominent avatar */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 1.25rem;
    }

    /* Prominent, visually compelling avatar styling */
    .brand-avatar {
      width: 110px; 
      height: 110px;
      object-fit: contain;
      border-radius: 20px;
      background-color: #ffffff; /* Enhances the clean white background of the image */
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      transition: transform 0.3s ease;
    }

    .brand-avatar:hover {
      transform: scale(1.05);
    }

    header h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.125rem;
    }

    /* Category Filter Navigation */
    .filter-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1.5rem auto 2.5rem;
      padding: 0 1rem;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* Grid Layout */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      flex: 1;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }

    /* App Card Styling */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
      border-color: #475569;
    }

    .card-img-wrapper {
      width: 100%;
      height: 190px;
      background: #090d16;
      position: relative;
      overflow: hidden;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      background: var(--badge-bg);
      color: var(--badge-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }

    .card-author {
      font-size: 0.825rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      font-style: italic;
    }

    .card-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
      flex: 1;
    }

    .card-btn {
      display: block;
      text-align: center;
      background: var(--accent);
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    .card-btn:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }

    /* Minimalist Footer with Integrated Author Avatar */
    footer {
      background: #090d16;
      border-top: 1px solid var(--card-border);
      padding: 2.5rem 1.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .footer-content {
      max-width: 650px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
    }

    .author-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .author-info {
      line-height: 1.6;
      text-align: left;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      .footer-content {
        flex-direction: column;
        text-align: center;
      }
      .author-info {
        text-align: center;
      }
      /* Ensure title scales nicely on mobile */
      .brand-header {
        flex-direction: column;
        gap: 1rem;
      }
      header h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-header">
      <!-- Referencing the specific new image file prominently -->
      <img src="GrubbSims_Avatar.png" alt="GrubbSims Logo" class="brand-avatar">
      <h1>GrubbSims</h1>
    </div>
    <p>Interactive Simulations & Virtual Labs For Chemistry, Physics, and Mathematics</p>
  </header>

  <nav class="filter-nav" id="filterNav">
    <button class="filter-btn active" data-category="All">All (13)</button>
    <button class="filter-btn" data-category="Chemistry">Chemistry</button>
    <button class="filter-btn" data-category="Physics">Physics</button>
    <button class="filter-btn" data-category="Math">Math</button>
    <button class="filter-btn" data-category="Casual Game">Casual Games</button>
  </nav>

  <main class="container">
    <div class="app-grid" id="appGrid"></div>
  </main>

  <footer>
    <div class="footer-content">
      <img 
        src="./WTG-ProfilePic-Cropped-Warmer.jpg" 
        alt="Tandy Grubbs" 
        class="author-avatar"
      >
      <div class="author-info">
        Developed by <strong>Tandy Grubbs</strong>, Chemistry Instructor at the 
        <a href="https://www.ncssm.edu/directory/tandy-grubbs" target="_blank" rel="noopener">North Carolina School of Science and Mathematics</a>.
        <br>
        Connect on <a href="https://www.linkedin.com/in/dr-tandy-grubbs-6160529/" target="_blank" rel="noopener">LinkedIn</a>.
      </div>
    </div>
  </footer>

  <script>
    // Embedded App Data
    const apps = [
      {
        category: "Casual Game",
        title: "Sue's Cozy Goat Farm",
        author: "Tandy Grubbs",
        folder: "suesgoatfarm",
        screenshot: "suesgoatfarm.png",
        description: "Explore your surroundings, find goats, and bring them back to the barn before nightfall. Beware of bears."
      },
      {
        category: "Casual Game",
        title: "Mahjong Solitaire",
        author: "Tandy Grubbs",
        folder: "mahjong",
        screenshot: "mahjong.png",
        description: "Mahjong Solitaire, the classic tile-matching puzzle game."
      },
      {
        category: "Casual Game",
        title: "Poker Solitaire",
        author: "Tandy Grubbs",
        folder: "solitaire",
        screenshot: "solitaire.png",
        description: "The classic Poker card stacking solitaire game played with a standard pack of 52 playing cards."
      },
      {
        category: "Physics",
        title: "Penduloodle",
        author: "Tandy Grubbs",
        folder: "penduloodle",
        screenshot: "penduloodle.png",
        description: "Create your own pendulum painting. Newtonian dynamic simulation generating intricate, swirling Spirographic patterns."
      },
      {
        category: "Chemistry",
        title: "Chemical Reaction Dynamics - Langevin Model",
        author: "Tandy Grubbs",
        folder: "langevindynamics",
        screenshot: "langevindynamics.png",
        description: "Explore the dynamic, random motion of reactant molecules transitioning to product molecules over an energy barrier."
      },
      {
        category: "Chemistry",
        title: "Virtual Titration Lab",
        author: "Tandy Grubbs",
        folder: "virtualtitrator",
        screenshot: "virtualtitrator.png",
        description: "Titrate an unknown weak acid solution with a strong base to determine molarity and pKa."
      },
      {
        category: "Chemistry",
        title: "Organic Nomenclature",
        author: "Tandy Grubbs",
        folder: "organicnomenclature",
        screenshot: "organicnomenclature.png",
        description: "Master IUPAC naming conventions for organic chains up to 10 carbons, parent chains, functional groups, and substituents."
      },
      {
        category: "Chemistry",
        title: "Mahjong Chem",
        author: "Tandy Grubbs",
        folder: "mahjongchem",
        screenshot: "mahjongchem.png",
        description: "A tile-matching game matching polyatomic ion names with formulas, metric prefixes, and chemical symbols."
      },
      {
        category: "Chemistry",
        title: "Kinetic Molecular Gas Simulation",
        author: "Tandy Grubbs",
        folder: "kineticmoleculargas",
        screenshot: "kineticmoleculargas.png",
        description: "Explore kinetic molecular theory and how particle speeds and energy are impacted by temperature, mass, and volume."
      },
      {
        category: "Chemistry",
        title: "VSEPR",
        author: "Tandy Grubbs",
        folder: "vsepr",
        screenshot: "vsepr.png",
        description: "Identify shapes of chemical compounds, bonding domains, lone pairs, bond angles, and hybridization."
      },
      {
        category: "Chemistry",
        title: "Atomic Orbitals - Quantum Mechanics Sandbox",
        author: "Ritika Mora and Gia Gia Vo",
        folder: "atomicorbitals",
        screenshot: "atomicorbitals.png",
        description: "Visualize atomic orbital shapes, quantum numbers, and spectral absorption/emission wavelengths."
      },
      {
        category: "Chemistry",
        title: "Le Chatelier Principle",
        author: "Brecken O'Leary",
        folder: "lechatelier",
        screenshot: "lechatelier.png",
        description: "Apply stresses to chemical equilibrium and investigate how concentration, temperature, and pressure shift reaction quotients."
      },
      {
        category: "Math",
        title: "Mandelbrot Renderer",
        author: "Tandy Grubbs",
        folder: "mandelbrot",
        screenshot: "mandelbrot.png",
        description: "Graphically zoom in and explore the infinite, repeating detail of the complex Mandelbrot fractal set."
      }
    ];

    const appGrid = document.getElementById('appGrid');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function renderApps(filterCategory = 'All') {
      appGrid.innerHTML = '';
      const filtered = filterCategory === 'All' 
        ? apps 
        : apps.filter(app => app.category === filterCategory);

      filtered.forEach(app => {
        const imagePath = `./${app.folder}/${app.screenshot}`;
        const appUrl = `./${app.folder}/`;

        const cardHtml = `
          <div class="card">
            <div class="card-img-wrapper">
              <img src="${imagePath}" alt="${app.title}" onerror="this.src='https://via.placeholder.com/400x200/1e293b/94a3b8?text=${encodeURIComponent(app.title)}'">
            </div>
            <div class="card-body">
              <div class="card-header">
                <span class="badge">${app.category}</span>
              </div>
              <h2 class="card-title">${app.title}</h2>
              <p class="card-author">By ${app.author}</p>
              <p class="card-desc">${app.description}</p>
              <a href="${appUrl}" class="card-btn">Launch Simulation →</a>
            </div>
          </div>
        `;
        appGrid.innerHTML += cardHtml;
      });
    }

    // Filter Button Event Listeners
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderApps(btn.dataset.category);
      });
    });

    // Initial Render
    renderApps();
  </script>
</body>
</html>
